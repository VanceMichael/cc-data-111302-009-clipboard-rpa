<html lang="zh-CN"><meta charset="utf-8"><title>跨窗口富内容粘贴的浏览器录入自动化</title><body><h1>产品资料来源</h1><article id="product" data-product="P-1" data-version="1"><h2>合成产品甲</h2><p>耐用外壳</p><table><tr><td>尺寸</td><td>20 cm</td></tr></table><a href="https://example.test/manual">说明书</a></article><button id="copy">复制资料</button><button id="change">更新版本</button><output id="copied"></output><script>
copy.onclick=async()=>{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([product.outerHTML],{type:'text/html'}),'text/plain':new Blob([product.innerText],{type:'text/plain'})})]);copied.textContent='已复制';};change.onclick=()=>{product.dataset.version=String(Number(product.dataset.version)+1);product.querySelector('p').textContent='更新后的外壳';};</script></body></html>
