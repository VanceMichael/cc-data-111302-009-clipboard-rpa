<html lang="zh-CN"><meta charset="utf-8"><body><h1>发布门户</h1><div id="editor" contenteditable="true" role="textbox" aria-label="资料正文"></div><output id="status"></output><script>
editor.addEventListener('paste',event=>{event.preventDefault();status.textContent='清理中';editor.dataset.settled='false';const html=event.clipboardData.getData('text/html');editor.innerHTML=html||event.clipboardData.getData('text/plain');setTimeout(()=>{for(const element of editor.querySelectorAll('script,style,img'))element.remove();for(const element of editor.querySelectorAll('*')){for(const attribute of [...element.attributes])if(attribute.name.startsWith('on'))element.removeAttribute(attribute.name);}editor.dataset.settled='true';status.textContent='已清理';},100);});</script></body></html>
